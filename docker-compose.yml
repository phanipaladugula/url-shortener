version: '3.8'

services:
  # The Database (Persistence)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: "Phani@123"
    ports:
      - "5432:5432"

  # The Speed Layer (Cache)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # The Message Broker (Analytics)
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Your Go Application (The API)
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
      - kafka
    environment:
      # These must match your init function's connection strings
      DB_URL: "postgres://postgres:Phani@123@db:5432/postgres"
      REDIS_URL: "redis:6379"
      KAFKA_URL: "kafka:9092"